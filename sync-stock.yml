name: Sincronizar stock y fotos desde StockVence

on:
  schedule:
    # Cada 1 hora. GitHub Actions no garantiza el minuto exacto, puede
    # atrasarse un poco en horas pico — para esto no hace falta precision.
    - cron: '0 * * * *'
  workflow_dispatch: {} # permite tocar "Run workflow" a mano desde GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Sincronizar stock.json
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-desde-stockvence.mjs

      - name: Commitear cambios (si hay)
        run: |
          git config user.name "StockVence Sync"
          git config user.email "actions@users.noreply.github.com"
          git add stock.json
          if git diff --cached --quiet; then
            echo "Sin cambios de stock."
          else
            git commit -m "Sincronizar stock desde StockVence"
            git push
          fi
